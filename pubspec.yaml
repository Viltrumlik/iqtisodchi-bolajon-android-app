name: economicgame
description: "Bolalar uchun moliyaviy savodxonlik o'yini - Uzbek tilida"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3
  provider: ^6.1.2
  flutter_animate: ^4.5.0
  audioplayers: ^6.0.0
  share_plus: ^13.3.0
  open_filex: ^4.7.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/correct.wav
    - assets/sounds/wrong.wav
    - assets/sounds/purchase.wav
    - assets/sounds/tick.wav
    - assets/sounds/celebrate.wav
    - assets/puzzle/
    - assets/avatars/
    - assets/lessons/lesson_plans.json
    - assets/lessons/docs/
